AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Meridian support-ticketing + case-summariser platform. Region-agnostic (uses
  pseudo params AWS::Region / AWS::AccountId only -- deploy the same template
  unmodified into any region). Sized for the ~$60 / 6-month demo budget: all
  DynamoDB tables are PAY_PER_REQUEST, Lambdas are small/short-lived,
  API Gateway is HTTP API (cheaper than REST API), and S3 has a lifecycle rule
  to expire demo attachments after 30 days. See ../../docs/aws-cost-notes.md.

Parameters:
  EnvironmentName:
    Type: String
    Default: beta
    AllowedValues: [beta, prod]
    Description: >
      Selects the backend's ConfigResolver env layer (APP_ENV) used inside
      the Lambdas, so the exact same wildcard config-fallback rules that
      govern the offline app also govern the deployed one.
  LlmProvider:
    Type: String
    Default: anthropic
    AllowedValues: [anthropic, openai, ollama, test-stub]
  LogRetentionDays:
    Type: Number
    Default: 14
  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Optional. Email address subscribed to the alarm SNS topic. Leave empty
      to create the topic and alarms without a subscription (you can
      subscribe a pager/chat integration to the topic later).

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64] # cheaper + faster cold start than x86_64
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        APP_ENV: !Ref EnvironmentName
        AWS_REGION_OVERRIDE: !Ref AWS::Region
        TICKETS_TABLE: !Ref TicketsTable
        POLICIES_TABLE: !Ref PoliciesTable
        ORDERS_TABLE: !Ref OrdersTable
        ATTACHMENTS_BUCKET: !Ref AttachmentsBucket
        SECRETS_PREFIX: !Sub "/meridian/${EnvironmentName}/"

Resources:
  # ---------------------------------------------------------------------
  # Data layer -- DynamoDB (on-demand billing keeps this near-zero at demo
  # traffic levels; see cost notes doc)
  # ---------------------------------------------------------------------
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "meridian-${EnvironmentName}-tickets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
        - AttributeName: assigneeId
          AttributeType: S
        - AttributeName: creatorId
          AttributeType: S
        - AttributeName: ticketCreationDate
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byAssignee
          KeySchema:
            - AttributeName: assigneeId
              KeyType: HASH
            - AttributeName: ticketCreationDate
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: byCreator
          KeySchema:
            - AttributeName: creatorId
              KeyType: HASH
            - AttributeName: ticketCreationDate
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  PoliciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "meridian-${EnvironmentName}-policies"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: policyId
          AttributeType: S
      KeySchema:
        - AttributeName: policyId
          KeyType: HASH
      SSESpecification: { SSEEnabled: true }

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "meridian-${EnvironmentName}-orders"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byCustomer
          KeySchema:
            - AttributeName: customerId
              KeyType: HASH
          Projection: { ProjectionType: ALL }
      SSESpecification: { SSEEnabled: true }

  AssignmentCursorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "meridian-${EnvironmentName}-assignment-cursor"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cursorId
          AttributeType: S
      KeySchema:
        - AttributeName: cursorId
          KeyType: HASH

  # ---------------------------------------------------------------------
  # Attachments -- S3 (private, encrypted, lifecycle-limited for cost control)
  # ---------------------------------------------------------------------
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "meridian-${EnvironmentName}-attachments-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDemoAttachments
            Status: Enabled
            ExpirationInDays: 30
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]

  # ---------------------------------------------------------------------
  # Auth -- Cognito (SPA-friendly app client, no client secret; free tier
  # covers well over 50 MAU which is more than enough for a demo)
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "meridian-${EnvironmentName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "meridian-${EnvironmentName}-spa-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits: { AccessToken: hours, IdToken: hours }

  # ---------------------------------------------------------------------
  # Secrets -- API keys live in Secrets Manager, never in Lambda env vars
  # or source. ISecretsProvider's AwsSecretsManagerProvider reads these by
  # name at call time (see backend/src/secrets/AwsSecretsManagerProvider.ts).
  # ---------------------------------------------------------------------
  AnthropicApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/meridian/${EnvironmentName}/ANTHROPIC_API_KEY"
      Description: Anthropic (Claude) API key -- fill in the actual value via the console/CLI after stack creation, never in this template.
      GenerateSecretString:
        SecretStringTemplate: '{"placeholder": true}'
        GenerateStringKey: unused
        ExcludePunctuation: true

  # ---------------------------------------------------------------------
  # Compute -- one Lambda hosts the whole Express app (tickets + auth CRUD)
  # via serverless-http, so business logic is never duplicated between the
  # offline server and AWS; two more Lambdas cover the event-driven /
  # LLM-calling paths.
  # ---------------------------------------------------------------------
  MainApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "meridian-${EnvironmentName}-api"
      CodeUri: ../lambda/api/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TicketsTable }
        - DynamoDBReadPolicy: { TableName: !Ref PoliciesTable }
        - DynamoDBReadPolicy: { TableName: !Ref OrdersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AssignmentCursorTable }
        - S3CrudPolicy: { BucketName: !Ref AttachmentsBucket }
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  AssignTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "meridian-${EnvironmentName}-assign-ticket"
      CodeUri: ../lambda/assignTicket/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TicketsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AssignmentCursorTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt AssignTicketDlq.QueueName }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
              Resource: !GetAtt TicketsTable.StreamArn
      Events:
        TicketStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TicketsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 5
            MaximumRetryAttempts: 3
            # A ticket that could not be assigned after 3 retries lands here
            # instead of being silently dropped -- and the DLQ alarm fires.
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt AssignTicketDlq.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'

  AssignTicketDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "meridian-${EnvironmentName}-assign-ticket-dlq"
      MessageRetentionPeriod: 1209600 # 14 days -- long enough to investigate, matches log retention

  SummariseCaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "meridian-${EnvironmentName}-summarise-case"
      CodeUri: ../lambda/summariseCase/
      Handler: index.handler
      Timeout: 30 # LLM calls can run longer than the default API-fronted functions
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TicketsTable }
        - DynamoDBReadPolicy: { TableName: !Ref PoliciesTable }
        - DynamoDBReadPolicy: { TableName: !Ref OrdersTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AnthropicApiKeySecret
      Events:
        ApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/cases/{ticketId}/summarise
            Method: POST

  # ---------------------------------------------------------------------
  # API Gateway -- HTTP API (cheaper than REST API) with a Cognito JWT
  # authorizer shared by every route except /api/auth/login.
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "meridian-${EnvironmentName}-http-api"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/meridian-${EnvironmentName}-api"
      RetentionInDays: !Ref LogRetentionDays

  AssignTicketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/meridian-${EnvironmentName}-assign-ticket"
      RetentionInDays: !Ref LogRetentionDays

  SummariseCaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/meridian-${EnvironmentName}-summarise-case"
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------
  # Observability -- alarms for the backend stack.
  #
  # Every alarm notifies AlarmTopic (subscribe an email via the AlarmEmail
  # parameter, or attach a chat/pager integration later). Thresholds are
  # tuned for demo traffic: at this volume a single 5xx or Lambda error in
  # five minutes is worth a look, and "missing data" means "nobody is using
  # it", not "it is broken", so alarms treat missing data as OK.
  #
  # What each alarm tells the on-call person (see infra/README.md runbook):
  #   Api*            the Express app behind API Gateway is failing/slow
  #   SummariseCase*  the LLM path is failing, throttled, or about to time out
  #   AssignTicket*   tickets are being created but not assigned
  #   Tickets*        DynamoDB is throttling the tickets table
  #   Http5xx/Latency what customers/agents actually experience at the edge
  # ---------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "meridian-${EnvironmentName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # --- API Gateway edge ---
  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-http-5xx"
      AlarmDescription: One or more 5xx responses from the HTTP API in 5 minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  HttpLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-http-latency-p95"
      AlarmDescription: p95 end-to-end API latency above 5s for two consecutive 5-minute periods (excludes the summarise route's expected LLM wait only by threshold; investigate if sustained).
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # --- Main API Lambda ---
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-api-lambda-errors"
      AlarmDescription: The API Lambda returned an error (unhandled exception / crash) in the last 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref MainApiFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-api-lambda-throttles"
      AlarmDescription: The API Lambda was throttled (account concurrency exhausted) in the last 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref MainApiFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-api-lambda-duration-p95"
      AlarmDescription: API Lambda p95 duration above 12s (80% of its 15s timeout) -- requests are about to start timing out.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - { Name: FunctionName, Value: !Ref MainApiFunction }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 12000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # The Express errorHandler logs exactly "Unhandled error:" for every 500 it
  # returns (backend/src/middleware/errorHandler.ts). Lambda's Errors metric
  # does NOT see these (the function returned normally), so count them from
  # the log instead.
  ApiUnhandledErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '"Unhandled error:"'
      MetricTransformations:
        - MetricNamespace: !Sub "Meridian/${EnvironmentName}"
          MetricName: ApiUnhandledErrors
          MetricValue: "1"
          DefaultValue: 0

  ApiUnhandledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ApiUnhandledErrorMetricFilter
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-api-500s"
      AlarmDescription: The Express app returned one or more 500 Internal Server Error responses in 5 minutes (see "Unhandled error:" lines in the API log group).
      Namespace: !Sub "Meridian/${EnvironmentName}"
      MetricName: ApiUnhandledErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # --- Summarise (LLM) Lambda ---
  SummariseCaseErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-summarise-errors"
      AlarmDescription: The summarise-case Lambda failed in the last 5 minutes -- agents cannot get AI drafts; switch them to the manual process (see runbook).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref SummariseCaseFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  SummariseCaseThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-summarise-throttles"
      AlarmDescription: The summarise-case Lambda was throttled in the last 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref SummariseCaseFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SummariseCaseDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-summarise-duration-p95"
      AlarmDescription: Summarise-case p95 duration above 24s (80% of its 30s timeout) -- the LLM provider is slow; drafts are about to start timing out.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - { Name: FunctionName, Value: !Ref SummariseCaseFunction }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 24000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # The provider failure the code logs (AnthropicProvider / the Lambda stub
  # both throw "Anthropic API request failed with status <n>").
  SummariseProviderFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SummariseCaseLogGroup
      FilterPattern: '"API request failed with status"'
      MetricTransformations:
        - MetricNamespace: !Sub "Meridian/${EnvironmentName}"
          MetricName: LlmProviderFailures
          MetricValue: "1"
          DefaultValue: 0

  SummariseProviderFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: SummariseProviderFailureMetricFilter
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-llm-provider-failures"
      AlarmDescription: The LLM provider returned a non-2xx status 3+ times in 5 minutes (bad key, quota exhausted, or provider outage). Check the secret and the provider status page before anything else.
      Namespace: !Sub "Meridian/${EnvironmentName}"
      MetricName: LlmProviderFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # --- Assignment (DynamoDB stream) Lambda ---
  AssignTicketErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-assign-errors"
      AlarmDescription: The assign-ticket stream Lambda failed in the last 5 minutes -- new tickets may be stuck in OPEN.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref AssignTicketFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  AssignTicketIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-assign-stream-lag"
      AlarmDescription: The assign-ticket Lambda is more than 60s behind the tickets stream for two periods -- assignment is lagging or stuck on a poison record.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - { Name: FunctionName, Value: !Ref AssignTicketFunction }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  AssignTicketDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-assign-dlq-not-empty"
      AlarmDescription: A ticket-created event exhausted its retries and landed in the assignment DLQ. The ticket exists but is unassigned; assign it manually and redrive after fixing the cause.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt AssignTicketDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # --- DynamoDB (on-demand tables can still throttle on sudden bursts) ---
  TicketsReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-tickets-read-throttle"
      AlarmDescription: DynamoDB throttled reads on the tickets table in the last 5 minutes.
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - { Name: TableName, Value: !Ref TicketsTable }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  TicketsWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-tickets-write-throttle"
      AlarmDescription: DynamoDB throttled writes on the tickets table in the last 5 minutes -- ticket creation/assignment/draft saves may be failing.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - { Name: TableName, Value: !Ref TicketsTable }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # --- One "is anything wrong?" signal for the on-call rota ---
  BackendHealthCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub "meridian-${EnvironmentName}-backend-unhealthy"
      AlarmDescription: Fires when any customer-facing failure alarm is in ALARM. Subscribe pagers here; the individual alarms tell you where to look.
      AlarmRule: !Sub >-
        ALARM("${Http5xxAlarm}") OR ALARM("${ApiErrorsAlarm}") OR ALARM("${ApiUnhandledErrorsAlarm}")
        OR ALARM("${SummariseCaseErrorsAlarm}") OR ALARM("${SummariseProviderFailuresAlarm}")
        OR ALARM("${AssignTicketErrorsAlarm}") OR ALARM("${AssignTicketDlqAlarm}")
        OR ALARM("${TicketsWriteThrottleAlarm}")
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # First three dashboards per account are free.
  BackendDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "meridian-${EnvironmentName}-backend"
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "alarm", "x": 0, "y": 0, "width": 24, "height": 3,
              "properties": { "title": "Backend alarms", "alarms": [
                "${Http5xxAlarm.Arn}", "${ApiErrorsAlarm.Arn}", "${ApiUnhandledErrorsAlarm.Arn}",
                "${SummariseCaseErrorsAlarm.Arn}", "${SummariseProviderFailuresAlarm.Arn}", "${SummariseCaseDurationAlarm.Arn}",
                "${AssignTicketErrorsAlarm.Arn}", "${AssignTicketIteratorAgeAlarm.Arn}", "${AssignTicketDlqAlarm.Arn}",
                "${TicketsReadThrottleAlarm.Arn}", "${TicketsWriteThrottleAlarm.Arn}" ] } },
            { "type": "metric", "x": 0, "y": 3, "width": 12, "height": 6,
              "properties": { "title": "API Gateway requests / 4xx / 5xx", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiId", "${HttpApi}" ],
                  [ ".", "4xx", ".", "." ],
                  [ ".", "5xx", ".", "." ] ] } },
            { "type": "metric", "x": 12, "y": 3, "width": 12, "height": 6,
              "properties": { "title": "API Gateway latency p50 / p95", "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  [ "AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p50" } ],
                  [ "...", { "stat": "p95" } ] ] } },
            { "type": "metric", "x": 0, "y": 9, "width": 12, "height": 6,
              "properties": { "title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${MainApiFunction}" ],
                  [ "...", "${SummariseCaseFunction}" ],
                  [ "...", "${AssignTicketFunction}" ] ] } },
            { "type": "metric", "x": 12, "y": 9, "width": 12, "height": 6,
              "properties": { "title": "Summarise duration p95 vs 30s timeout", "region": "${AWS::Region}", "period": 300,
                "metrics": [ [ "AWS/Lambda", "Duration", "FunctionName", "${SummariseCaseFunction}", { "stat": "p95" } ] ],
                "annotations": { "horizontal": [ { "label": "timeout", "value": 30000 }, { "label": "alarm", "value": 24000 } ] } } },
            { "type": "metric", "x": 0, "y": 15, "width": 12, "height": 6,
              "properties": { "title": "LLM provider failures / API 500s (from logs)", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "Meridian/${EnvironmentName}", "LlmProviderFailures" ],
                  [ ".", "ApiUnhandledErrors" ] ] } },
            { "type": "metric", "x": 12, "y": 15, "width": 12, "height": 6,
              "properties": { "title": "Assignment: stream lag (ms) and DLQ depth", "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "IteratorAge", "FunctionName", "${AssignTicketFunction}", { "stat": "Maximum" } ],
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${AssignTicketDlq.QueueName}", { "stat": "Maximum", "yAxis": "right" } ] ] } }
          ]
        }

Conditions:
  IsProd: !Equals [!Ref EnvironmentName, prod]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  TicketsTableName:
    Value: !Ref TicketsTable
  AlarmTopicArn:
    Description: Subscribe pagers/chat integrations here; every backend alarm publishes to it.
    Value: !Ref AlarmTopic
  BackendDashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=meridian-${EnvironmentName}-backend"
  AssignTicketDlqUrl:
    Value: !Ref AssignTicketDlq
